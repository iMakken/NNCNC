<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NNCNC — Speed & Distance Tracker</title>
    <style>
        :root {
            --bg-color: #111416;
            --accent-color: #d5ff1c;
            --text-color: #ffffff;
            --muted-color: #5d6367;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 24px;
        }
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .logo {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.03em;
            text-transform: uppercase;
        }
        .status-badge {
            font-size: 14px;
            color: var(--accent-color);
            font-family: monospace;
        }
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 60px;
            padding: 40px 0;
        }
        .display-data {
            font-family: monospace, sans-serif;
        }
        .speed {
            font-size: clamp(4rem, 10vw, 8rem);
            font-weight: 900;
            color: var(--accent-color);
            line-height: 1;
            letter-spacing: -0.04em;
        }
        .unit {
            font-size: clamp(1.5rem, 3vw, 2.5rem);
            color: var(--text-color);
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 5px;
        }
        .action-circle {
            width: clamp(180px, 25vw, 260px);
            height: clamp(180px, 25vw, 260px);
            background-color: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 50px rgba(213, 255, 28, 0.15);
        }
        .action-circle:hover {
            transform: scale(1.04);
        }
        .play-icon {
            width: 0;
            height: 0;
            border-top: clamp(20px, 3vw, 30px) solid transparent;
            border-bottom: clamp(20px, 3vw, 30px) solid transparent;
            border-left: clamp(35px, 5vw, 50px) solid #111416;
            margin-left: clamp(8px, 1.5vw, 12px);
        }
        .download-box {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .btn {
            background: #191d20;
            color: var(--text-color);
            padding: 16px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            border: 1px solid rgba(255,255,255,0.03);
            text-transform: uppercase;
            letter-spacing: 0.02em;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #22272b;
        }
        footer {
            text-align: center;
            color: var(--muted-color);
            font-size: 0.75rem;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 40px;
        }
        @media (min-width: 800px) {
            .hero {
                flex-direction: row;
                justify-content: space-around;
                text-align: left;
                padding: 80px 0;
            }
            .hero-left {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">NNCNC</div>
        <div class="status-badge">bike status: live</div>
    </header>

    <main class="hero">
        <div class="hero-left">
            <div class="display-data">
                <div class="speed">00.0</div>
                <div class="unit">km/h tracking</div>
            </div>
            <div class="download-box">
                <a href="#" class="btn">App Store</a>
                <a href="#" class="btn">Google Play</a>
            </div>
        </div>
        
        <div class="hero-right">
            <!-- Крупная кнопка "Старт", как в самом приложении -->
            <a href="#" class="action-circle" title="Get the App">
                <div class="play-icon"></div>
            </a>
        </div>
    </main>

    <footer>
        <p>NNCNC LAB &copy; 2026 // ZERO DISTRACTIONS</p>
    </footer>
</div>

</body>
</html>
